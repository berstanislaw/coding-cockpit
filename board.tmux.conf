set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g status off
set -g allow-rename off
set -g automatic-rename off
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB:extkeys,xterm-ghostty:RGB:extkeys,xterm-kitty:RGB:extkeys"
set -s extended-keys on
set-environment -g COLORTERM truecolor
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style "fg=#3a4050"
set -g pane-active-border-style "fg=#3a4050"
set -g destroy-unattached on
set -g pane-border-status top
set -g pane-border-format "#{?#{@lb_title},#{?pane_active,#[fg=#ffffff#,bg=#5e6ad2#,bold#,fill=#5e6ad2] ● ,#[fg=#8b919c] }#{@lb_title} ,}"
bind -n C-MouseDown1Pane select-pane -t = \; send-keys -M
bind -n MouseDown3Pane select-pane -t = \; send-keys -M
bind -n M-MouseDown3Pane select-pane -t = \; send-keys -M
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-1 select-pane -t '{left}' \; send-keys -t '{left}' M-1
bind -n M-2 select-pane -t '{left}' \; send-keys -t '{left}' M-2
bind -n M-3 select-pane -t '{left}' \; send-keys -t '{left}' M-3
bind -n M-4 select-pane -t '{left}' \; send-keys -t '{left}' M-4
bind 1 select-pane -t '{left}' \; send-keys -t '{left}' M-1
bind 2 select-pane -t '{left}' \; send-keys -t '{left}' M-2
bind 3 select-pane -t '{left}' \; send-keys -t '{left}' M-3
bind 4 select-pane -t '{left}' \; send-keys -t '{left}' M-4
